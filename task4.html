<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styling text</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    /* First Heading: Serif font, orange color, left aligned */
    h1 {
      font-family: "Georgia", "Times New Roman", serif;
      color: #ffa500;
      font-size: 32px;
      font-weight: normal;
      text-align: left;
    }

    /* Second Heading: Bold sans-serif font, right aligned */
    h2 {
      font-family: Arial, sans-serif;
      color: #000000;
      font-size: 28px;
      font-weight: bold;
      text-align: right;
    }

    /* First Paragraph: Sans-serif font, left aligned */
    .p-left {
      font-family: Arial, sans-serif;
      font-size: 18px;
      color: #000000;
      text-align: left;
    }

    /* Second Paragraph: Monospace font, right aligned */
    .p-right {
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      color: #000000;
      text-align: right;
    }
  </style>
</head>
<body>

  <h1>Styling text</h1>
  <h2>Heading Num. 2</h2>
  <p class="p-left">My first paragraph.</p>
  <p class="p-right">My second paragraph.</p>

</body>
</html>
