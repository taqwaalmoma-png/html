<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="fname">First name:</label><br>
        <input type="text" id="fname" name="fname">
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="phone number">Phone number:</label><br>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <label for="destination">Destination:</label><br>
        <input type="t" id="destination" name="destination">
        <br><br>

        <label for="travel date">Travel date:</label><br>
        <input type="date" id="travel-date" name="travel-date">
        <br><br>

        <label for="number of travels">Number of travelers:</label><br>
        <input type="number" id="number-of-travelers" name="number-of-travelers">
        <br><br>

        <label for="additional notes">Additional notes:</label><br>
        <input type="text" id="additional-notes" name="additional-notes">
        <br><br>

        <label for="submit">Submit:</label><br>
        <button type="submit" value="Submit">Submit</button>
        <br><br>


    </form>
</body>
</html>
